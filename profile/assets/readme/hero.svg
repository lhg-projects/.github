<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">刘老师 · LLS — AI 实操方向的内容与工具仓</title>
  <desc id="desc">左侧是组织名与一句话定位；右侧是三个入口卡片：课程与内容、中文技能包、工具与源码，右上角一个红色动作点。</desc>

  <defs>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282C36"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#graphite)"/>
  <rect x="56" y="64" width="72" height="10" fill="#FF453A"/>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2" fill="#FF7A5C">LHG-PROJECTS · AI 实操</text>
    <text x="56" y="188" font-size="58" font-weight="700" fill="#FFFFFF">刘老师 · LLS</text>
    <text x="56" y="234" font-size="26" fill="#E8E6E1">AI 实操方向的内容与工具仓。</text>
    <text x="56" y="270" font-size="21" fill="#A7ABB5">不空谈概念，只讲能上手的步骤。</text>
    <line x1="56" y1="296" x2="600" y2="296" stroke="#2A2E38" stroke-width="2"/>
    <text x="56" y="330" font-size="18" fill="#E8E6E1">连载《WorkBuddy 从零基础到入门》 · 抖音搜「刘老师讲AI实战」</text>
  </g>

  <!-- Three entry cards -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="700" y="56" width="444" height="268" rx="16" fill="#171A21" stroke="#3A3F4C" stroke-width="2"/>
    <circle cx="1108" cy="92" r="10" fill="#FF453A"/>
    <g font-size="22" fill="#FFFFFF">
      <text x="736" y="122">📺 课程与内容</text>
      <text x="736" y="192">🧰 中文技能包</text>
      <text x="736" y="262">🛠️ 工具与源码</text>
    </g>
    <g font-size="18" fill="#A7ABB5">
      <text x="736" y="150">WorkBuddy 从零基础到入门</text>
      <text x="736" y="220">技能市场搜 lls- 一次找全</text>
      <text x="736" y="290">本组织公开仓库，见下表</text>
    </g>
  </g>
</svg>
